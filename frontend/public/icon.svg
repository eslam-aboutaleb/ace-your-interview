<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1d1f"/>
      <stop offset="100%" style="stop-color:#2d2f31"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Sleeping emoji-style face -->
  <!-- Face circle -->
  <circle cx="256" cy="260" r="150" fill="#FFD93D"/>
  
  <!-- Left closed eye (sleeping line) -->
  <path d="M180 230 Q200 210 220 230" stroke="#1c1d1f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Right closed eye (sleeping line) -->
  <path d="M290 230 Q310 210 330 230" stroke="#1c1d1f" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Sleepy mouth (slightly open) -->
  <ellipse cx="256" cy="320" rx="20" ry="15" fill="#1c1d1f"/>
  
  <!-- ZZZ floating -->
  <text x="350" y="160" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#a78bfa" opacity="0.9">Z</text>
  <text x="380" y="120" font-family="Arial, sans-serif" font-weight="bold" font-size="50" fill="#a78bfa" opacity="0.7">Z</text>
  <text x="415" y="75" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#a78bfa" opacity="0.5">Z</text>
  
  <!-- Sleep cap -->
  <path d="M150 220 Q160 120 256 100 Q352 120 362 220" fill="#a78bfa" opacity="0.85"/>
  <circle cx="256" cy="90" r="18" fill="#c4b5fd"/>
</svg>
