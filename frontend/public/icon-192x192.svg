<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="32" fill="#1c1d1f"/>
  <g transform="translate(96,96)">
    <!-- Graduation cap -->
    <g transform="translate(0,-10)">
      <!-- Cap base -->
      <polygon points="-50,10 0,-20 50,10 0,35" fill="#a435f0"/>
      <!-- Cap top -->
      <polygon points="-35,2 0,-22 35,2 0,20" fill="#c77dff"/>
      <!-- Tassel line -->
      <line x1="0" y1="-20" x2="35" y2="-20" stroke="#a435f0" stroke-width="3"/>
      <!-- Tassel -->
      <circle cx="35" cy="-18" r="5" fill="#a435f0"/>
      <line x1="35" y1="-13" x2="35" y2="5" stroke="#a435f0" stroke-width="2.5"/>
      <rect x="30" y="5" width="10" height="6" rx="2" fill="#a435f0"/>
    </g>
    <!-- Book -->
    <g transform="translate(0,30)">
      <rect x="-30" y="-8" width="60" height="16" rx="3" fill="#e0aaff" opacity="0.8"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#1c1d1f" stroke-width="2"/>
    </g>
  </g>
</svg>
