repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      # ruff-format is intentionally omitted: the tree is not yet
      # format-clean (183 files). Enable it after a one-time
      # `ruff format` pass so the reformat lands in its own commit.
      - id: ruff
