[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-app-backend"
version = "2.0.0"
description = "Ace Your Interview backend – generates interview Q&A via LiteLLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "litellm>=1.30.0",
    "groq>=0.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyJWT>=2.8.0",
    "cryptography>=43.0.0",
    "edge-tts>=6.1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
# Convenience wrapper for the Stage 4.1 eval harness. The canonical invocation
# stays `python scripts/eval_agent_quality.py`, which needs no install.
eval-agent-quality = "scripts.eval_agent_quality:main"

[tool.hatch.build.targets.wheel]
# "scripts" is packaged only so the eval-agent-quality console script above can
# resolve; it is not imported by the application at runtime.
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
# Generated protobuf stubs are vendored, not project code.
omit = ["app/generated/*"]

[tool.coverage.report]
# Floor, not a target. Measured at 79% when this was set; kept one point below
# so an unrelated flake cannot turn the build red, while a real coverage drop
# still does. Raise it as the suite grows.
fail_under = 78
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
