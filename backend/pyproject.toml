[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-app-backend"
version = "2.0.0"
description = "Ace Your Interview backend – generates interview Q&A via LiteLLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "litellm>=1.30.0",
    "groq>=0.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyJWT>=2.8.0",
    "cryptography>=43.0.0",
    "edge-tts>=6.1.0",
    "websockets>=12.0",
    "fsrs>=4.1,<4.2",
    "pypdf",
    "mammoth",
    "sqlite-vec>=0.1.9",
    "python-multipart>=0.0.32",
    "grpcio>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# Installed by a plain `uv sync` (the CI entry point).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
# Vendored protobuf stubs are generated code, not project source
# (same rationale as the coverage omit list below).
exclude = ["app/generated"]

[tool.ruff.lint]
# Pin the rule set explicitly so a ruff upgrade cannot silently
# widen the CI gate.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
# Generated protobuf stubs are vendored, not project code.
omit = ["app/generated/*"]

[tool.coverage.report]
# The plan's gate: no regression below 90% total (statement + branch).
# Current measured value is ~98%, so this fails only on a real regression.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
