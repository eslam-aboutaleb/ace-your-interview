[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-app-backend"
version = "2.0.0"
description = "Study webapp backend – generates interview Q&A via LiteLLM (supports OpenAI, Anthropic, Google, Groq, Ollama, and more)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "litellm>=1.30.0",
    "groq>=0.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
