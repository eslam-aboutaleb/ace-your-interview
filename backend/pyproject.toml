[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-app-backend"
version = "2.0.0"
description = "Ace Your Interview backend – generates interview Q&A via LiteLLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "litellm>=1.30.0",
    "groq>=0.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyJWT>=2.8.0",
    "cryptography>=43.0.0",
    "edge-tts>=6.1.0",
    "websockets>=12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
