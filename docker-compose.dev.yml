# Development docker-compose with hot reload
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/docs:/app/docs:ro
      - ./backend/main.py:/app/main.py
    env_file:
      - ./backend/.env
    environment:
      STUDY_DOCS_PATH: /app/docs
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    environment:
      VITE_DEV_BACKEND_URL: http://backend:8001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
