name: backend

# Stage 4.1 tier 1: the deterministic CI tier.
#
# Everything here must be reproducible offline: no provider credentials, no
# network calls into the app, no golden-output drift. The live tier that
# regenerates against real models lives in eval-live.yml and is deliberately
# not wired into push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

  eval-harness:
    name: eval harness + prompt contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Exits non-zero when any gate fails. The gates are: production-validator
      # agreement (schema_valid_rate), the two production-derived prompt
      # contracts, untrusted-input containment, the golden prompt digests, and
      # the duplicate / grounding / repair / degraded budgets.
      - name: Run deterministic eval harness
        run: python scripts/eval_agent_quality.py --json | tee eval-report.json

      # Proves the harness did not quietly re-baseline itself: a prompt edit has
      # to be an explicit, reviewable change to evals/prompt_snapshots.json.
      - name: Assert the golden prompt digests were not re-baselined
        run: |
          if ! git diff --exit-code -- evals/prompt_snapshots.json; then
            echo "::error::evals/prompt_snapshots.json changed during the run. Re-baselining must be a deliberate, reviewed commit." >&2
            exit 1
          fi

      - name: Production-validator binding and prompt-contract tests
        run: python -m pytest tests/test_eval_agent_quality.py -v

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report.json
          if-no-files-found: error
          retention-days: 14
