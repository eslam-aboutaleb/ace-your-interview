services:
  - type: web
    # NOTE: Render blueprint service names are immutable — renaming
    # this field breaks the blueprint sync. Keep the original name.
    name: study-app-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STUDY_DOCS_PATH
        value: ./docs
      - key: STUDY_DEFAULT_PROVIDER
        value: groq
      - key: STUDY_DEFAULT_MODEL
        value: llama-3.3-70b-versatile
      - key: STUDY_DEV_AUTH_BYPASS_LOCALHOST
        value: "false"
      - key: STUDY_CORS_ORIGINS
        sync: false # Set manually to your Vercel URL
      - key: GROQ_API_KEY
        sync: false # Set via Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STUDY_AUTH_SECRET_KEY
        sync: false
      - key: STUDY_FRONTEND_URL
        sync: false
      - key: STUDY_GITHUB_CLIENT_ID
        sync: false
      - key: STUDY_GITHUB_CLIENT_SECRET
        sync: false
      - key: STUDY_GOOGLE_CLIENT_ID
        sync: false
      - key: STUDY_GOOGLE_CLIENT_SECRET
        sync: false
      - key: STUDY_ALLOWED_GITHUB_USERS
        value: eslam-aboutaleb
      - key: STUDY_ALLOWED_GOOGLE_EMAILS
        value: eslamehababoutaleb@gmail.com
    rootDir: backend
    healthCheckPath: /health
