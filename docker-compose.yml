services:
  study-backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/docs:/app/docs:ro
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      STUDY_DOCS_PATH: /app/docs
    restart: unless-stopped

  study-frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    depends_on:
      - study-backend
    restart: unless-stopped
